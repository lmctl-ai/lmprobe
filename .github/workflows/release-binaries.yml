name: release-binaries

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target to build
        required: true
        default: linux-x64
        type: choice
        options:
          - linux-x64

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  select-targets:
    name: select targets
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          TARGET: ${{ inputs.target }}
        run: |
          # Linux-only by design: only linux-x64 is a valid target; anything
          # else fails closed rather than silently building nothing.
          case "$TARGET" in
            linux-x64)
              include='[{"artifact":"lmprobe-x86_64-unknown-linux-gnu","runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","binary":"lmprobe","archive":"tar.gz","os":"linux"}]'
              ;;
            *)
              echo "target $TARGET is not supported; release-binaries only builds linux-x64" >&2
              exit 2
              ;;
          esac
          {
            echo "matrix<<JSON"
            echo "{\"include\":$include}"
            echo "JSON"
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.artifact }}
    needs: select-targets
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.select-targets.outputs.matrix) }}

    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # Keep legacy process-id/timestamp temp fixtures from racing under
      # platform-dependent clock granularity during packaging CI.
      RUST_TEST_THREADS: 1

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Show Rust host target
        run: rustc -Vv

      # The select-targets matrix above can only emit a linux-x64 entry, so
      # there is no macOS/Windows branch here. Cross-platform binaries ship
      # through release-npm.yml. Any new target belongs behind an explicit
      # workflow_dispatch choice, never behind push/schedule.
      - name: Build and test portable Linux release binary
        run: |
          docker run --rm \
            -v "$PWD":/work \
            -w /work \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            ubuntu:20.04 \
            bash scripts/ci/linux_portable_build.sh test-build

      - name: Package archive (tar)
        run: |
          mkdir -p "dist/${{ matrix.artifact }}"
          cp "target/release/${{ matrix.binary }}" "dist/${{ matrix.artifact }}/"
          cp README.md LICENSE ATTRIBUTION.md "dist/${{ matrix.artifact }}/"
          tar -C dist -czf "dist/${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.${{ matrix.archive }}
          if-no-files-found: error

  checksums:
    name: checksums
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          (
            cd dist
            mapfile -d '' archives < <(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -printf '%P\0' | sort -z)
            if [ "${#archives[@]}" -eq 0 ]; then
              echo "no release archives found" >&2
              exit 1
            fi
            sha256sum "${archives[@]}"
          ) > SHA256SUMS
          cat SHA256SUMS

      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SHA256SUMS
          path: SHA256SUMS
          if-no-files-found: error
