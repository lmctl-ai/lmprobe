name: lmprobe-secrets

on:
  pull_request:
    paths:
      - "crates/lmprobe-secrets/**"
      - "crates/lmprobe-engine/src/secrets.rs"
      - "crates/lmprobe-engine/src/sensors.rs"
      - "crates/lmprobe/src/cli.rs"
      - "crates/lmprobe-types/src/schema.rs"
      - "durable-memory/21_secrets.md"
      - "xtask/**"
      - ".github/workflows/lmprobe-secrets.yml"
  push:
    branches: [main]
    paths:
      - "crates/lmprobe-secrets/**"
      - "crates/lmprobe-engine/src/secrets.rs"
      - "crates/lmprobe-engine/src/sensors.rs"
      - "crates/lmprobe/src/cli.rs"
      - "crates/lmprobe-types/src/schema.rs"
      - "durable-memory/21_secrets.md"
      - "xtask/**"
      - ".github/workflows/lmprobe-secrets.yml"

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Provider DB schema validation
        run: cargo test -p lmprobe-secrets --test provider_db -- --nocapture
      - name: Source DB schema validation
        run: cargo test -p lmprobe-secrets --test source_db -- --nocapture
      - name: Provider coverage table check
        run: cargo xtask provider-coverage --check
      - name: Source coverage table check
        run: cargo xtask source-coverage --check
      - name: Provider positive/negative snippet check
        run: cargo test -p lmprobe-secrets --test semantic_db_all_providers -- --nocapture
      - name: Source positive/negative snippet check
        run: cargo test -p lmprobe-secrets --test source_db default_source_db_positive_and_negative_snippets_validate_for_every_language_entry -- --nocapture
      - name: Test lmprobe-secrets
        run: cargo test -p lmprobe-secrets -- --nocapture
      - name: Upstream config fixture check
        run: cargo test -p lmprobe-secrets --test upstream_config_sync -- --nocapture
      - name: Parity test
        run: cargo test -p lmprobe-secrets --test gitleaks_parity -- --nocapture
      - name: Clippy
        run: cargo clippy -p lmprobe-secrets --all-targets -- -D warnings
      - name: Fmt
        run: cargo fmt --check
