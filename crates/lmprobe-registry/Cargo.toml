[package]
name = "lmprobe-registry"
version = "0.1.0"
edition = "2021"
authors = ["Lattice Systems LLC"]
license = "MIT"
description = "lmprobe foundation crate: per-language dispatch registry. Aggregates per-lang crates and exposes name_extractor_for(SgLang) etc."

