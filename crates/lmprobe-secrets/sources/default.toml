id = "aws-secrets-manager"
description = "AWS Secrets Manager secret reads"
category = "secret-manager"
credential_kind = "external-secret"
source_urls = ["https://docs.aws.amazon.com/secretsmanager/latest/userguide/retrieving-secrets.html"]
fast_path_tokens = ["GetSecretValue", "get_secret_value", "GetSecretValueCommand", "secretsmanager"]

[[sources.languages]]
language = "python"
sdk = "boto3-secretsmanager-v1"
source_node_kinds = ["call"]
positive_test = '''client.get_secret_value(SecretId="prod/stripe")'''
negative_test = '''client.list_secrets()'''
[[sources.languages.read_shapes]]
kind = "sdk_call"
callees = ["get_secret_value"]
import_hints = ["boto3", "secretsmanager"]

[[sources.languages]]
language = "javascript"
sdk = "aws-sdk-js-v3-secretsmanager"
source_node_kinds = ["call_expression", "new_expression"]
positive_test = '''client.send(new GetSecretValueCommand({ SecretId: name }));'''
negative_test = '''client.send(new ListSecretsCommand({}));'''
[[sources.languages.read_shapes]]
kind = "sdk_call"
callees = ["GetSecretValueCommand"]
import_hints = ["@aws-sdk/client-secrets-manager"]

[[sources.languages]]
language = "go"
sdk = "aws-sdk-go-v2-secretsmanager"
source_node_kinds = ["call_expression"]
positive_test = '''client.GetSecretValue(ctx, &secretsmanager.GetSecretValueInput{SecretId: aws.String(name)})'''
negative_test = '''client.ListSecrets(ctx, &secretsmanager.ListSecretsInput{})'''
[[sources.languages.read_shapes]]
kind = "sdk_call"
callees = ["GetSecretValue"]
import_hints = ["secretsmanager"]

[[sources.languages]]
language = "java"
sdk = "aws-sdk-java-v2-secretsmanager"
source_node_kinds = ["method_invocation"]
positive_test = '''client.getSecretValue(GetSecretValueRequest.builder().secretId(name).build());'''
negative_test = '''client.listSecrets(ListSecretsRequest.builder().build());'''
[[sources.languages.read_shapes]]
kind = "sdk_call"
callees = ["getSecretValue"]
import_hints = ["software.amazon.awssdk.services.secretsmanager"]

