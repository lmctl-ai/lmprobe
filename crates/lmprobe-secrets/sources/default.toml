# Seed credential-source database for lmprobe-secrets.
# Source taxonomy is local to lmprobe; provider_id values join to providers/default.toml.

schema_version = 1
title = "lmprobe credential source database"

[[sources]]
id = "env-aws"
description = "AWS credential environment variable reads"
category = "env"
provider_id = "aws"
credential_kind = "key-secret-pair"
env_var_names = ["AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_SESSION_TOKEN"]
source_urls = ["https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-envvars.html"]
fast_path_tokens = ["AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_SESSION_TOKEN"]

[[sources.languages]]
language = "python"
sdk = "stdlib-env"
source_node_kinds = ["call", "subscript"]
positive_test = '''import os
secret = os.environ["AWS_SECRET_ACCESS_KEY"]'''
negative_test = '''import os
region = os.getenv("AWS_REGION")'''
[[sources.languages.read_shapes]]
kind = "env_read"
access_paths = ["os.environ", "os.getenv", "os.environ.get"]
keys = ["AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_SESSION_TOKEN"]
import_hints = ["os"]

[[sources.languages]]
language = "javascript"
sdk = "node-env"
source_node_kinds = ["member_expression", "subscript_expression"]
positive_test = '''const secret = process.env.AWS_SECRET_ACCESS_KEY;'''
negative_test = '''const region = process.env.AWS_REGION;'''
[[sources.languages.read_shapes]]
kind = "env_read"
access_paths = ["process.env"]
keys = ["AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_SESSION_TOKEN"]

[[sources.languages]]
language = "go"
sdk = "stdlib-env"
source_node_kinds = ["call_expression"]
positive_test = '''import "os"
secret := os.Getenv("AWS_SECRET_ACCESS_KEY")'''
negative_test = '''import "os"
region := os.Getenv("AWS_REGION")'''
[[sources.languages.read_shapes]]
kind = "env_read"
access_paths = ["os.Getenv", "os.LookupEnv"]
keys = ["AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_SESSION_TOKEN"]
import_hints = ["os"]

[[sources.languages]]
language = "java"
sdk = "stdlib-env"
source_node_kinds = ["method_invocation"]
positive_test = '''String secret = System.getProperty("AWS_SECRET_ACCESS_KEY");'''
negative_test = '''String region = System.getenv("AWS_REGION");'''
[[sources.languages.read_shapes]]
kind = "env_read"
access_paths = ["System.getenv", "System.getProperty"]
keys = ["AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_SESSION_TOKEN"]

