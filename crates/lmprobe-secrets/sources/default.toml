id = "hashicorp-vault-kv"
description = "HashiCorp Vault KV secret reads"
category = "vault"
credential_kind = "external-secret"
source_urls = ["https://developer.hashicorp.com/vault/api-docs/secret/kv/kv-v2"]
fast_path_tokens = ["hvac", "read_secret_version", "KVv2", "node-vault", "vault.logical"]

[[sources.languages]]
language = "python"
sdk = "hvac-v1"
source_node_kinds = ["call"]
positive_test = '''import hvac
secret = client.secrets.kv.v2.read_secret_version(path="prod/aws")'''
negative_test = '''import hvac
status = client.sys.health()'''
[[sources.languages.read_shapes]]
kind = "kv_get"
access_paths = ["secrets.kv.v2.read_secret_version"]
key_names = ["path"]
import_hints = ["hvac"]

[[sources.languages]]
language = "javascript"
sdk = "node-vault-current"
source_node_kinds = ["call_expression"]
positive_test = '''const vault = require("node-vault")();
const secret = vault.read("secret/data/prod");'''
negative_test = '''const vault = require("node-vault")();
vault.status();'''
[[sources.languages.read_shapes]]
kind = "kv_get"
access_paths = ["vault.read"]
key_names = ["secret/data"]
import_hints = ["node-vault"]

[[sources.languages]]
language = "go"
sdk = "vault-api-v1"
source_node_kinds = ["call_expression"]
positive_test = '''secret, err := client.KVv2("secret").Get(ctx, "prod/aws")'''
negative_test = '''health, err := client.Sys().Health()'''
[[sources.languages.read_shapes]]
kind = "kv_get"
access_paths = ["KVv2", "Get"]
key_names = ["secret"]
import_hints = ["vault/api"]

[[sources.languages]]
language = "java"
sdk = "vault-java-current"
source_node_kinds = ["method_invocation"]
positive_test = '''var response = vault.logical().read("secret/data/prod");'''
negative_test = '''var health = vault.debug().health();'''
[[sources.languages.read_shapes]]
kind = "kv_get"
access_paths = ["logical().read", "logical.read"]
key_names = ["secret/data"]
import_hints = ["vault"]

