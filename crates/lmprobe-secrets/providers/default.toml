# Provider semantic sink database for lmprobe-secrets.
# Joins to gitleaks rule IDs from the gitleaks MIT project.

schema_version = 1
title = "lmprobe provider semantic sink database"

[[providers]]
id = "aws"
description = "Amazon Web Services"
rule_ids = [
  "aws-access-token",
  "aws-amazon-bedrock-api-key-long-lived",
  "aws-amazon-bedrock-api-key-short-lived",
]
credential_kind = "key-secret-pair"
sdk_urls = [
  "https://boto3.amazonaws.com/",
  "https://docs.aws.amazon.com/sdk-for-javascript/",
  "https://docs.aws.amazon.com/sdk-for-go/",
  "https://docs.aws.amazon.com/sdk-for-java/",
]
fast_path_tokens = [
  "boto3",
  "aws_secret_access_key",
  "S3Client",
  "fromStatic",
  "NewStaticCredentials",
  "AwsBasicCredentials",
  "BasicAWSCredentials",
]

[[providers.languages]]
language = "python"
sdk = "boto3-v1"
sink_node_kinds = ["call"]
positive_test = '''boto3.client("s3", aws_secret_access_key=secret)'''
negative_test = '''boto3.client("s3")'''

[[providers.languages.call_shapes]]
kind = "call"
callee = "boto3.client"
kwargs = ["aws_access_key_id", "aws_secret_access_key", "aws_session_token"]
