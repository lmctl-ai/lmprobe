[[providers.languages]]
language = "javascript"
sdk = "aws-sdk-js-v3"
sink_node_kinds = ["call_expression", "new_expression", "object"]
positive_test = '''new S3Client({ credentials: { accessKeyId: id, secretAccessKey: secret } })'''
negative_test = '''new S3Client({ region: "us-east-1" })'''

