# lmapi overlay for `lmprobe --schema` (cli.schema.v1).
#
# The operation schemas are GENERATED from the clap command tree (flags, shorts, aliases,
# occurrence, defaults, value enums, positionals, help text). This file adds what clap cannot
# say: the published lmapi name of each operation, its access, whether it is dangerous
# (requires --confirm), and parameters to leave out or fix.
#
# Rules (enforced by tests in src/lmapi):
# - every clap leaf command is either published by at least one [[op]] or listed in `excluded`;
# - every [[op]] has `access` (a missing access is an error, never read-only);
# - published names never equal a legacy subcommand name, so legacy argv such as
#   `lmprobe def X` keeps the legacy parser (lmapi protocol 6.1): single-word commands get a
#   distinct name (def -> def_symbol, grep -> grep_text, ...);
# - `exclude_params` lists clap arg ids (snake_case) that are not published for that op.

# Commands that are never published.
excluded = ["serve", "help"]

# Args owned by the legacy output path; never lmapi params.
exclude_params = [
  "json",
  "outfile",
  "infile",
  "format",
  "exit_zero_on_no_match",
  # Only change stderr diagnostics; lmapi mode never returns the child's stderr.
  "quiet",
  "verbose",
]

# Common options published only where the dispatch consumes them (keeps the document small).
# -A/-B/-C feed `ContextLines`, used only by ref (markdown) and grep (cli.rs run_invocation).
[only_for]
after = ["grep_text", "ref_symbol"]
before = ["grep_text", "ref_symbol"]
context = ["grep_text", "ref_symbol"]

