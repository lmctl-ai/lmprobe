# --- previews (read) and their applying write ops ----------------------------------------

[[op]]
name = "edit_preview"
command = "edit"
access = "read"
description = "Preview text replacements and line edits (writes nothing)"
exclude_params = ["apply"]

[[op]]
name = "edit_text"
command = "edit"
access = "write"
dangerous = true
description = "Apply text replacements and line edits"
exclude_params = ["apply"]
fixed_args = ["--apply"]

[[op]]
name = "fix_preview"
command = "fix"
access = "read"
description = "Preview AST replacements (writes nothing)"
exclude_params = ["apply"]

[[op]]
name = "fix_ast"
command = "fix"
access = "write"
dangerous = true
description = "Apply AST replacements via an audited worktree patch"
exclude_params = ["apply"]
fixed_args = ["--apply"]

# --- deletion and trace (write, dangerous) -----------------------------------------------

[[op]]
name = "find_delete"
command = "find"
access = "write"
dangerous = true
description = "Delete the files find selects; previews unless force is set"
exclude_params = ["action", "paths_only", "null"]
fixed_args = ["--action", "delete"]

[[op]]
name = "delete_paths"
command = "delete"
access = "write"
dangerous = true
description = "Delete the given files; previews unless force is set"
exclude_params = ["null"]
stdin_param = { name = "paths", description = "Paths to delete (one per entry)" }

[[op]]
name = "trace_exec"
command = "trace"
access = "write"
dangerous = true

# --- GraphQL (dynamic: mutations write) ---------------------------------------------------

[[op]]
name = "query_graphql"
command = "query"
access = "dynamic"
