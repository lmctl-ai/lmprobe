[package]
name = "lmprobe-types"
version = "0.1.0"
edition = "2021"
authors = ["Lattice Systems LLC"]
license = "MIT"
description = "lmprobe foundation crate: D4 envelope schemas + typed scalars (no parser deps)"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
async-graphql = { version = "7.0", features = ["chrono"] }
async-trait = "0.1"
ast-grep-language = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
anyhow = { workspace = true }
